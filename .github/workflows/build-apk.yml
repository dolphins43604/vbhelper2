name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the most recently uploaded .patch file, whatever it is named
      # (phones often save downloads as "custom-changes (1).patch").
      - name: Apply the custom changes
        run: |
          patch_file=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.patch' | grep -v '^$' | tail -1)
          echo "Applying: $patch_file"
          git apply "$patch_file"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build bracelet NFC library
        run: |
          git clone https://github.com/cfogrady/lib-vb-nfc "$RUNNER_TEMP/lib-vb-nfc"
          cd "$RUNNER_TEMP/lib-vb-nfc"
          chmod +x gradlew
          ./gradlew :vb-nfc-reader:publishToMavenLocal --no-daemon

      - name: Build card library
        run: |
          git clone https://github.com/cfogrady/VB-DIM-Reader "$RUNNER_TEMP/VB-DIM-Reader"
          cd "$RUNNER_TEMP/VB-DIM-Reader"
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon -x test

      - name: Match card library version
        run: |
          built=$(ls "$HOME/.m2/repository/com/github/cfogrady/vb-dim-reader" | grep -v maven-metadata | sort -V | tail -1)
          sed -i "s/^dimReader = \".*\"/dimReader = \"$built\"/" gradle/libs.versions.toml

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VBHelper-Custom-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
